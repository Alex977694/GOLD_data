<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/style.css">

    <title>GOLD Chart</title>
</head>
<body>

    <h1>GOLD Chart</h1>

    <div id="status" class="status">
        Loading GOLD data...
    </div>

    <!-- GOLD CHART HEADER -->
    <div class="section-title chart-title">
        <span>GOLD CHART</span>

        <div class="chart-tools">
            <label for="interval" class="chart-interval-label">
                TIME:
            </label>

            <select
                id="interval"
                class="chart-interval-select"
                title="Candle interval"
            >
                <option value="1m" selected>1m</option>
                <option value="5m">5m</option>
                <option value="15m">15m</option>
            </select>
        </div>
    </div>

    <!-- GOLD CHART -->
    <div
        id="metaChartContainer"
        style="
            width: 100%;
            height: 750px;
            background: #111827;
            border-radius: 8px;
            overflow: hidden;
        "
    ></div>

        <!-- GOLD DATA INFO -->
    <div class="section">
        <div class="section-title">GOLD DATA</div>
        <div id="dataInfo" class="data-info">-</div>
    </div>

    <!-- GOLD CHART SCRIPT -->
    <script src="/Metachart.js"></script>

</body>
</html>
